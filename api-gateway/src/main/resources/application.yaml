server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: word-service
              uri: http://word-service:777
              predicates:
                - Path=/graphql/wordService
              filters:
                - SetPath=/graphql
                - Auth
            - id: identity-service
              uri: http://identity-service:7771
              predicates:
                - Path=/graphql/IdentityService
              filters:
                - SetPath=/graphql
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

application:
  security:
    jwt:
      secret-key: ${JWT_SECURITY_KEY}
      expiration: ${JWT_EXPIRATION_TIME:5h}
