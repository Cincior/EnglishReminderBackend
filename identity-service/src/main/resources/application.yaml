spring:
  graphql:
    schema:
      introspection:
        enabled: true
  application:
    name: IdentityService
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_NODE_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

application:
  security:
    jwt:
      secret-key: ${JWT_SECURITY_KEY}
      expiration: ${JWT_EXPIRATION_TIME:10m}
      refreshExpiration: ${JWT_REFRESH_EXPIRATION_TIME:3d}
  rabbitmq:
    exchange: ${RABBITMQ_NOTIFICATION_EXCHANGE}
    routing-key: ${RABBITMQ_REGISTRATION_EMAIL_ROUTING_KEY}
  admin:
#    - ADMIN_SEED_ENABLED=${ADMIN_SEED_ENABLED}
    email: ${ADMIN_SEED_EMAIL}
    password: ${ADMIN_SEED_PASSWORD}
    nickname: ${ADMIN_SEED_NICKNAME}
    name: ${ADMIN_SEED_NAME}
    surname: ${ADMIN_SEED_SURNAME}
    role: ${ADMIN_SEED_ROLE}
server:
  port: ${IDENTITY_SERVICE_PORT:7771}
