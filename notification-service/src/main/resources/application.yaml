spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_NODE_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_PROPERTIES_SMTP_AUTH}
          starttls:
            enable: true
            required: true
          ssl:
            trust: "smtp.gmail.com"

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
  rabbitmq:
    queue: ${RABBITMQ_VERIFICATION_CODE_QUEUE}
    exchange: ${RABBITMQ_NOTIFICATION_EXCHANGE}
    routing-key: ${RABBITMQ_REGISTRATION_EMAIL_ROUTING_KEY}
server:
  port: ${NOTIFICATION_SERVICE_PORT:7772}