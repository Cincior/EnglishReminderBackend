services:
  word-service:
    build: ./word-service
    container_name: WordService
    environment:
      - WORD_SERVICE_PORT=${WORD_SERVICE_PORT}
      - WORD_DB_HOST=${WORD_DB_HOST}
      - WORD_DB_PORT=${WORD_DB_PORT}
      - WORD_DB_NAME=${WORD_DB_NAME}
      - WORD_DB_USER=${WORD_DB_USER}
      - WORD_DB_PASSWORD=${WORD_DB_PASSWORD}
      - RABBITMQ_NODE_PORT=${RABBITMQ_NODE_PORT}
      - RABBITMQ_MANAGEMENT_PORT=${RABBITMQ_MANAGEMENT_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_NOTIFICATION_EXCHANGE=${RABBITMQ_NOTIFICATION_EXCHANGE}
      - RABBITMQ_NOTIFICATION_MOBILE_ROUTING_KEY=${RABBITMQ_NOTIFICATION_MOBILE_ROUTING_KEY}
#    ports:
#      - "${WORD_SERVICE_PORT}:${WORD_SERVICE_PORT}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network

  gateway-service:
    build: ./api-gateway
    container_name: ApiGateway
    environment:
      - GATEWAY_SERVICE_PORT=${GATEWAY_SERVICE_PORT}
      - JWT_SECURITY_KEY=${APPLICATION_SECURITY_JWT_SECRET_KEY}
      - JWT_EXPIRATION_TIME=${APPLICATION_SECURITY_JWT_EXPIRATION}
      - REDIS_HOST=${APPLICATION_REDIS_HOST}
      - REDIS_PORT=${APPLICATION_REDIS_PORT}
    ports:
      - "${GATEWAY_SERVICE_PORT}:${GATEWAY_SERVICE_PORT}"
    depends_on:
      - word-service
      - identity-service
      - redis
    networks:
      - app-network

  identity-service:
    build: ./identity-service
    container_name: IdentityService
    environment:
      - IDENTITY_SERVICE_PORT=${IDENTITY_SERVICE_PORT}
      - JWT_SECURITY_KEY=${APPLICATION_SECURITY_JWT_SECRET_KEY}
      - JWT_EXPIRATION_TIME=${APPLICATION_SECURITY_JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION_TIME=${APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION_TIME}
      - RABBITMQ_NODE_PORT=${RABBITMQ_NODE_PORT}
      - RABBITMQ_MANAGEMENT_PORT=${RABBITMQ_MANAGEMENT_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_NOTIFICATION_EXCHANGE=${RABBITMQ_NOTIFICATION_EXCHANGE}
      - RABBITMQ_REGISTRATION_EMAIL_ROUTING_KEY=${RABBITMQ_REGISTRATION_EMAIL_ROUTING_KEY}
      - ADMIN_SEED_ENABLED=${ADMIN_SEED_ENABLED}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}
      - ADMIN_SEED_NICKNAME=${ADMIN_SEED_NICKNAME}
      - ADMIN_SEED_NAME=${ADMIN_SEED_NAME}
      - ADMIN_SEED_SURNAME=${ADMIN_SEED_SURNAME}
      - ADMIN_SEED_ROLE=${ADMIN_SEED_ROLE}
      - IDENTITY_DB_HOST=${IDENTITY_DB_HOST}
      - IDENTITY_DB_PORT=${IDENTITY_DB_PORT}
      - IDENTITY_DB_NAME=${IDENTITY_DB_NAME}
      - IDENTITY_DB_USER=${IDENTITY_DB_USER}
      - IDENTITY_DB_PASSWORD=${IDENTITY_DB_PASSWORD}
    ports:
      - "${IDENTITY_SERVICE_PORT}:${IDENTITY_SERVICE_PORT}"
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: NotificationService
    environment:
      - RABBITMQ_NODE_PORT=${RABBITMQ_NODE_PORT}
      - RABBITMQ_MANAGEMENT_PORT=${RABBITMQ_MANAGEMENT_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_NOTIFICATION_EXCHANGE=${RABBITMQ_NOTIFICATION_EXCHANGE}
      - RABBITMQ_REGISTRATION_EMAIL_ROUTING_KEY=${RABBITMQ_REGISTRATION_EMAIL_ROUTING_KEY}
      - RABBITMQ_NOTIFICATION_MOBILE_ROUTING_KEY=${RABBITMQ_NOTIFICATION_MOBILE_ROUTING_KEY}
      - RABBITMQ_VERIFICATION_CODE_QUEUE=${RABBITMQ_VERIFICATION_CODE_QUEUE}
      - RABBITMQ_MOBILE_NOTIFICATION_QUEUE=${RABBITMQ_MOBILE_NOTIFICATION_QUEUE}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_PROPERTIES_SMTP_AUTH=${MAIL_PROPERTIES_SMTP_AUTH}
      - FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase-key.json
#    ports:
#      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    volumes:
      - ./secrets/englishreminder-admin-key.json:/run/secrets/firebase-key.json:ro
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  predict-service:
    build: ./EnglishReminderPredictAPI
    container_name: PredictServiceApi
    environment:
      - PREDICT_SERVICE_PORT=${PREDICT_SERVICE_PORT}
    expose:
      - "${PREDICT_SERVICE_PORT}"
#    ports:
#      - "${PREDICT_SERVICE_PORT}:${PREDICT_SERVICE_PORT}"
    networks:
      - app-network

  redis:
    image: redis
#    ports:
#      - "6379:6379"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
#    ports:
#      - "${RABBITMQ_NODE_PORT}:5672"
#      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: Postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      WORD_DB_PASSWORD: ${WORD_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "${WORD_DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${WORD_DB_USER} -d ${WORD_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge