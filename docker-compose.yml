services:
  word-service:
    build: ./WordService
    container_name: WordService
    environment:
      - WORD_SERVICE_PORT=${WORD_SERVICE_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "${WORD_SERVICE_PORT}:${WORD_SERVICE_PORT}"
    networks:
      - app-network

  gateway-service:
    build: ./ApiGateway
    container_name: ApiGateway
    environment:
      - GATEWAY_SERVICE_PORT=${GATEWAY_SERVICE_PORT}
    ports:
      - "${GATEWAY_SERVICE_PORT}:${GATEWAY_SERVICE_PORT}"
    depends_on:
      - word-service
      - identity-service
    networks:
      - app-network

  identity-service:
    build: ./IdentityService
    container_name: IdentityService
    environment:
      - IDENTITY_SERVICE_PORT=${IDENTITY_SERVICE_PORT}
    ports:
      - "${IDENTITY_SERVICE_PORT}:${IDENTITY_SERVICE_PORT}"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge